<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnglishAI - Conversar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#2563eb">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 140px); }
        .message-animate { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .typing-indicator span {
            animation: pulse 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen">
    <!-- Header do Chat -->
    <header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center">
                    <span class="text-white">🤖</span>
                </div>
                <div>
                    <h1 class="font-semibold text-gray-800">Tutor IA</h1>
                    <p class="text-xs text-green-500" id="ai-status">Online</p>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="bg-blue-100 text-blue-700 text-xs font-medium px-2 py-1 rounded-full" id="chat-level">A1</span>
            <button onclick="toggleTopicMenu()" class="text-gray-400 hover:text-gray-600 p-2" title="Mudar tópico">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Menu de Tópicos -->
    <div id="topic-menu" class="bg-white border-b shadow-sm hidden">
        <div class="max-w-2xl mx-auto px-4 py-3">
            <p class="text-sm font-medium text-gray-600 mb-2">Escolha um tópico para praticar:</p>
            <div class="flex flex-wrap gap-2" id="topic-buttons">
                <!-- Preenchido pelo JS -->
            </div>
        </div>
    </div>

    <!-- Área de Mensagens -->
    <div class="flex-1 overflow-y-auto chat-container px-4 py-4" id="chat-messages">
        <!-- Mensagens aparecem aqui -->
    </div>

    <!-- Área de Input -->
    <div class="bg-white border-t px-4 py-3">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center space-x-3">
                <input type="text" id="message-input" placeholder="Digite em inglês..."
                    class="flex-1 px-4 py-3 bg-gray-100 rounded-full focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-gray-800"
                    onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" id="send-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-3 transition transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
            <p class="text-xs text-gray-400 text-center mt-2" id="input-hint">Pressione Enter para enviar</p>
        </div>
    </div>

    <!-- Script -->
    <script src="js/auth.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/gemini.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
